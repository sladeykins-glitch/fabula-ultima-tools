name: Apply Aestra Generation Intelligence
on:
  push:
    paths:
      - 'scripts/apply-aestra-generation-intelligence.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python scripts/apply-aestra-generation-intelligence.py
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/aestra.ts src/aestraWilds.ts src/App.tsx
          git commit -m "Use Aestra context before generation and preserve it through rerolls" || exit 0
          git push
