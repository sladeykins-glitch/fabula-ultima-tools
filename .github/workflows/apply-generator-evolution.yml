name: Apply generator evolution migration
on:
  push:
    paths:
      - '.github/workflows/apply-generator-evolution.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-generator-evolution.mjs
      - run: npm install --no-audit --no-fund --prefer-offline
      - run: npm run build
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Add variants power intent and inspiration to generators"
          git push
