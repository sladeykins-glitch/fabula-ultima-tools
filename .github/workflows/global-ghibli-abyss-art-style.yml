name: Apply global monster art style

on:
  push:
    paths:
      - 'scripts/patch-global-ghibli-abyss-art-style.py'
      - '.github/workflows/global-ghibli-abyss-art-style.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/patch-global-ghibli-abyss-art-style.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Make Ghibli Abyss the global monster art style'
            git push
          fi
