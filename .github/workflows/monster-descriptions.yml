name: Apply monster descriptions

on:
  push:
    paths:
      - 'scripts/patch-monster-descriptions.py'
      - '.github/workflows/monster-descriptions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch-monster-descriptions.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/monsterThemeEngine.ts src/App.tsx src/styles.css
          git commit -m "Add detailed monster field descriptions"
          git push
