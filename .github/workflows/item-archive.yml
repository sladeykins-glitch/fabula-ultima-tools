name: Apply item archive presentation
on:
  push:
    paths:
      - 'scripts/patch-item-archive.py'
      - '.github/workflows/item-archive.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/patch-item-archive.py
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restyle items as Aestra archive records"
          git push
