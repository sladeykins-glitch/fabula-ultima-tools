name: Apply Deeper Official Pattern
on:
  push:
    paths:
      - 'scripts/apply-official-pattern-depth.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python scripts/apply-official-pattern-depth.py
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/generatorEvolution.ts src/App.tsx
          git commit -m "Deepen Official Pattern structural modelling" || exit 0
          git push
