name: Fix monster description coherence

on:
  push:
    paths:
      - 'scripts/patch-monster-description-coherence.py'
      - '.github/workflows/monster-description-coherence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch-monster-description-coherence.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/monsterThemeEngine.ts
          git commit -m "Keep monster descriptions synced with traits"
          git push
